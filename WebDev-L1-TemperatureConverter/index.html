<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <main class="converter">
        <header class="header">
            <span class="eyebrow">TEMPERATURE TOOLS</span>
            <h1>Temperature<br><span>Converter.</span></h1>
            <p>Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>
        </header>

        <section class="converter-card">
            <div class="input-group">
                <label for="temperature">Enter temperature</label>
                <input
                    type="number"
                    id="temperature"
                    placeholder="e.g. 25"
                    step="any"
                >
            </div>

            <div class="input-group">
                <label for="unit">Convert from</label>
                <select id="unit">
                    <option value="Celsius">Celsius (°C)</option>
                    <option value="Fahrenheit">Fahrenheit (°F)</option>
                    <option value="Kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button id="convertBtn">Convert temperature <span>→</span></button>

            <p id="errorMessage" class="error-message"></p>

            <div class="results" id="results">
                <div class="results-heading">
                    <span>CONVERSION RESULTS</span>
                    <span class="result-icon">°</span>
                </div>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsiusResult">—</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">—</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">—</strong>
                </div>
            </div>
        </section>

        <footer>
            <span>Simple calculations. Accurate results.</span>
            <span>OIBSIP · Web Development</span>
        </footer>
    </main>

</body>
</html>
